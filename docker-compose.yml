version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: digitalbuzz-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: digitalbuzz
      MYSQL_USER: digitalbuzz_user
      MYSQL_PASSWORD: digitalbuzz_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - digitalbuzz-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digitalbuzz-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/digitalbuzz?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: digitalbuzz_user
      DB_PASSWORD: digitalbuzz_pass
      JWT_SECRET: MySecretKeyForJWTTokenGenerationAndValidationDigitalBuzzCMS2024
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - digitalbuzz-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/auth/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  mysql_data:
    driver: local

networks:
  digitalbuzz-network:
    driver: bridge
